<!DOCTYPE html>
<html lang="en" data-theme="ink">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary</title>
    <script src="i18n.js"></script>
    <script src="i18n-he.js"></script>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="ui-kit.css">
    <!-- Formula rendering (KaTeX, installed via npm - see summary.js) -->
    <link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            font-family: inherit;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar stays put while the summary scrolls underneath it. */
        .sum-toolbar {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-wrap: wrap;
            padding: var(--space-3) var(--space-5);
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-card);
            flex-shrink: 0;
        }
        .sum-toolbar__title { flex: 1; min-width: 180px; }
        .sum-toolbar__name {
            font-weight: var(--font-semibold);
            font-size: var(--text-base);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sum-toolbar__meta { font-size: var(--text-xs); color: var(--text-secondary); margin-top: 2px; }
        .sum-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

        .sum-btn {
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 6px 12px;
            font-size: var(--text-sm);
            font-family: inherit;
            cursor: pointer;
        }
        .sum-btn { height: 28px; padding: 0 10px; font-size: var(--text-xs); font-weight: 500; border-color: var(--border-strong); }
        .sum-btn:hover:not(:disabled) { background: var(--hover-bg); }
        .sum-btn:disabled { opacity: 0.5; cursor: default; }

        .sum-body { flex: 1; overflow-y: auto; }
        .sum-content {
            max-width: 820px;
            margin: 0 auto;
            padding: var(--space-6) var(--space-6) var(--space-7);
            line-height: 1.75;
            font-size: var(--sum-font-size, 16px);
        }
        .sum-content h2, .sum-content h3 { color: var(--text-primary); font-weight: 600; margin: 1.6em 0 0.4em; line-height: 1.3; letter-spacing: -0.01em; }
        .sum-content h2 { font-size: 1.25em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-color); }
        .sum-content h3 { font-size: 1.05em; }
        .sum-content > h2:first-child { margin-top: 0; }
        .sum-content p { margin: 0 0 0.8em; }
        .sum-content ul, .sum-content ol { margin: 0 0 0.9em; padding-inline-start: 1.4em; }
        .sum-content li { margin-bottom: 0.35em; }
        .sum-content code {
            font-family: Consolas, 'Courier New', monospace;
            background: var(--hover-bg);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.92em;
        }

        /* Multi-line code from the material. Always left-to-right (even in a
           Hebrew summary), indentation kept, and a long line scrolls
           sideways instead of wrapping - wrapped code is misleading. */
        .sum-content pre.code-block {
            direction: ltr;
            text-align: start;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.8em 1em;
            margin: 0.4em 0 1em;
            overflow-x: auto;
            line-height: 1.5;
        }
        .sum-content pre.code-block code {
            background: none;
            padding: 0;
            white-space: pre;
            font-size: 0.9em;
        }

        .sum-content hr { border: none; border-top: 1px solid var(--border-color); margin: 1.4em 0; }

        /* Formulas: isolated left-to-right inside Hebrew text, and wide
           display formulas scroll sideways instead of overflowing. */
        .math-inline { unicode-bidi: isolate; white-space: nowrap; }
        .math-display {
            text-align: center;
            margin: 0.6em 0 1em;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.3em 0;
        }
        .sum-content .katex { font-size: 1.08em; }

        .sum-state { text-align: center; padding: var(--space-8) var(--space-5); color: var(--text-secondary); }
        .sum-spinner {
            width: 30px; height: 30px; margin: 0 auto var(--space-4);
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sum-error { color: var(--status-danger); margin-bottom: var(--space-4); }
    </style>
</head>
<body>
    <div class="sum-toolbar">
        <div class="sum-toolbar__title">
            <div class="sum-toolbar__name" id="sum-file-name" dir="auto">Loading…</div>
            <div class="sum-toolbar__meta" id="sum-meta"></div>
        </div>
        <div class="sum-actions">
            <button class="sum-btn" id="sum-smaller" title="Smaller text">A−</button>
            <button class="sum-btn" id="sum-larger" title="Larger text">A+</button>
            <button class="sum-btn" id="sum-copy" disabled>Copy</button>
            <button class="sum-btn" id="sum-regenerate" disabled>Summarize again</button>
        </div>
    </div>

    <div class="sum-body">
        <div class="sum-content" id="sum-content" translate="no"></div>
    </div>

    <script src="summary.js"></script>
</body>
</html>
